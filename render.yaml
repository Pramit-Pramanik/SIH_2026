services:
  - type: web
    name: mandiq-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r backend/requirements.txt
    startCommand: python scripts/start_production.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mandiq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mandiq-redis
          property: connectionString
      - key: MANDIQ_SECRET_HMAC_KEY
        generateValue: true
      - key: MANDIQ_PAYOUT_SECRET_KEY
        generateValue: true
      - key: MANDIQ_AUTH_ENFORCED
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://frontend-gamma-coral-15.vercel.app","https://frontend-kissankasaman.vercel.app","https://frontend-f7k1xnduo-kissankasaman.vercel.app","https://frontend-54umjamh6-kissankasaman.vercel.app","https://frontend-nuc25y2o0-kissankasaman.vercel.app"]'

  - type: keyvalue
    name: mandiq-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: mandiq-postgres
    region: oregon
    plan: free
    databaseName: mandiq
    user: mandiq
