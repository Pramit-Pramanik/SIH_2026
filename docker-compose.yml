version: '3.8'

# MandiQ Prototype Support Services (Frozen Baseline: PostgreSQL 16 & Redis 7.2)
# Heavy external message brokers are strictly excluded per ADR-003.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mandiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mandiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mandiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: mandiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
