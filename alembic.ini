# MandiQ Repository-Root Alembic Configuration
# Targets backend/alembic migration scripts and resolves canonical runtime database URL.

[alembic]
script_location = backend/alembic
file_template = %%(rev)s_%%(slug)s
version_locations = backend/alembic/versions
version_path_separator = os
output_encoding = utf-8
sqlalchemy.url =

[post_write_hooks]

[logging]
default_level = INFO
